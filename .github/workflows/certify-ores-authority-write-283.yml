name: certify ORES authored authority write guard

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-authority-write-283.yml'
      - 'canaries/ores-authority-write-283/**'
      - 'contracts/platform/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-authority-write-283-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact HHM candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact HHM candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify vendored exact ORES PR 283 module
        shell: bash
        run: |
          set -euo pipefail
          root=canaries/ores-authority-write-283
          test "$(git hash-object "$root/src/audit/authority_write_protection.rs")" = \
            5dc91c0333fe99927e56c302bcb2bcc3ddcee03e

      - name: Install exact product Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Generate isolated harness lockfile
        working-directory: canaries/ores-authority-write-283
        run: cargo +1.95.0 generate-lockfile

      - name: Compile and execute exact product module
        working-directory: canaries/ores-authority-write-283
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 check --locked --all-targets
          cargo +1.95.0 clippy --locked --all-targets -- -D warnings
          cargo +1.95.0 test --locked --all-targets -- --nocapture
          cargo +1.95.0 test --release --locked --all-targets -- --nocapture
          tests="$(cargo +1.95.0 test --locked --all-targets -- --list)"
          grep -Fq 'allows_tjsv_reads_and_generated_json_output' <<<"$tests"
          grep -Fq 'protects_flat_split_authority_names' <<<"$tests"
          grep -Fq 'config_declared_custom_json_schema_is_protected' <<<"$tests"
          grep -Fq 'flat_peer_directory_transfer_is_rejected' <<<"$tests"
          grep -Fq 'config_declared_custom_schema_write_is_rejected' <<<"$tests"
          grep -Fq 'peer_reads_with_unrelated_output_are_not_writes' <<<"$tests"

      - name: Set up tested Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0

      - name: Prove TypeSpec and authored JSON Schema are independent first-class peers
        uses: ORESoftware/typespec-json-schema-validator@07688e1eea92a666f7e8647038c9f2c1544440ed
        with:
          typespec: contracts/platform/typespec/main.tsp
          schema: contracts/platform/json-schema/contract.schema.json
          report: .typespec-json-schema-validator/ores283/report.json
          sarif: .typespec-json-schema-validator/ores283/report.sarif
          contract_ir: .typespec-json-schema-validator/ores283/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores283/generated
          max_probes: '64'

      - name: Require current-input TJSV admission
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@07688e1eea92a666f7e8647038c9f2c1544440ed
        with:
          contract_ir: .typespec-json-schema-validator/ores283/contract-ir.json
          report: .typespec-json-schema-validator/ores283/report.json
          typespec: contracts/platform/typespec/main.tsp
          schema: contracts/platform/json-schema/contract.schema.json
          generated_schema: .typespec-json-schema-validator/ores283/generated/typespec.generated.schema.json
          expected_declarations: '["HackerHouseMedellin.Platform.ReservationContract"]'

      - name: Prepare TypeSpec-only drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .typespec-json-schema-validator/ores283-typespec-drift/source
          sed 's/enabled: boolean;/enabled: string;/' contracts/platform/typespec/main.tsp \
            > .typespec-json-schema-validator/ores283-typespec-drift/source/main.tsp

      - name: TypeSpec-only drift must fail parity
        id: typespec_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@07688e1eea92a666f7e8647038c9f2c1544440ed
        with:
          typespec: .typespec-json-schema-validator/ores283-typespec-drift/source/main.tsp
          schema: contracts/platform/json-schema/contract.schema.json
          report: .typespec-json-schema-validator/ores283-typespec-drift/report.json
          contract_ir: .typespec-json-schema-validator/ores283-typespec-drift/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores283-typespec-drift/generated
          max_probes: '64'

      - name: Assert TypeSpec-only drift rejection
        env:
          OUTCOME: ${{ steps.typespec_drift.outcome }}
        run: test "$OUTCOME" = failure

      - name: Prepare JSON-Schema-only drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .typespec-json-schema-validator/ores283-json-drift/source
          cp contracts/platform/json-schema/contract.schema.json \
            .typespec-json-schema-validator/ores283-json-drift/source/contract.schema.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = '.typespec-json-schema-validator/ores283-json-drift/source/contract.schema.json';
          const schema = JSON.parse(await readFile(path, 'utf8'));
          schema.$defs.ReservationContract.properties.enabled.type = 'string';
          await writeFile(path, `${JSON.stringify(schema, null, 2)}\n`);
          NODE

      - name: JSON-Schema-only drift must fail parity
        id: schema_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@07688e1eea92a666f7e8647038c9f2c1544440ed
        with:
          typespec: contracts/platform/typespec/main.tsp
          schema: .typespec-json-schema-validator/ores283-json-drift/source/contract.schema.json
          report: .typespec-json-schema-validator/ores283-json-drift/report.json
          contract_ir: .typespec-json-schema-validator/ores283-json-drift/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores283-json-drift/generated
          max_probes: '64'

      - name: Assert JSON-Schema-only drift rejection and source immutability
        env:
          OUTCOME: ${{ steps.schema_drift.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          git diff --exit-code -- contracts/platform canaries/ores-authority-write-283/Cargo.toml \
            canaries/ores-authority-write-283/src/model.rs \
            canaries/ores-authority-write-283/src/audit/mod.rs \
            canaries/ores-authority-write-283/src/audit/authority_write_protection.rs \
            canaries/ores-authority-write-283/src/lib.rs \
            canaries/ores-authority-write-283/tests
          test "$(git hash-object canaries/ores-authority-write-283/src/audit/authority_write_protection.rs)" = \
            5dc91c0333fe99927e56c302bcb2bcc3ddcee03e
