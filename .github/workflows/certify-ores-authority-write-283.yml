name: certify ORES authored authority write guard

on:
  pull_request:
    paths:
      - '.github/workflows/certify-ores-authority-write-283.yml'
      - 'contracts/platform/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-authority-write-283-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact HHM candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact HHM candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact ores-cli PR 283 product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: fdab96526e954a370cc65174ae685c572265337c
          path: product/ores-cli
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable product identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product/ores-cli rev-parse HEAD)" = fdab96526e954a370cc65174ae685c572265337c
          test "$(git -C product/ores-cli hash-object src/audit/authority_write_protection.rs)" = ba77043c08b0f37bee5c0630be12e71c5b77a18f

      - name: Install exact product Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy

      - name: Run exact product write-protection regressions
        working-directory: product/ores-cli
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 test --locked --lib authority_write_protection::tests -- --nocapture
          cargo +1.95.0 clippy --locked --lib -- -D warnings

      - name: Exercise the shipped CLI against controlled peer fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/authority-write-fixture"
          mkdir -p "$fixture/contracts/account" "$fixture/.github/workflows"
          cat > "$fixture/contracts/account/main.tsp" <<'TSP'
          namespace AuthorityWrite;
          model Account { id: string; }
          TSP
          cat > "$fixture/contracts/account/authored.schema.json" <<'JSON'
          {"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object","properties":{"id":{"type":"string"}},"required":["id"]}
          JSON

          cat > "$fixture/.github/workflows/contracts.yml" <<'GOOD'
          run: tjsv check --typespec=contracts/account/main.tsp --schema=contracts/account/authored.schema.json --output-dir=.typespec-json-schema-validator/account/generated
          GOOD
          set +e
          cargo +1.95.0 run --quiet --manifest-path product/ores-cli/Cargo.toml --bin ores-cli -- --no-json audit repo --path "$fixture" --profile baseline >"$RUNNER_TEMP/good.out" 2>&1
          good_status=$?
          set -e
          ! grep -Fq 'peer-authority-direct-write' "$RUNNER_TEMP/good.out"
          printf 'read-only fixture audit exit=%s (other structural findings are allowed)\n' "$good_status"

          cat > "$fixture/.github/workflows/contracts.yml" <<'BAD'
          run: cp generated/main.tsp contracts/account/main.tsp
          BAD
          set +e
          cargo +1.95.0 run --quiet --manifest-path product/ores-cli/Cargo.toml --bin ores-cli -- --no-json audit repo --path "$fixture" --profile baseline >"$RUNNER_TEMP/bad.out" 2>&1
          bad_status=$?
          set -e
          test "$bad_status" -ne 0
          grep -Fq 'peer-authority-direct-write' "$RUNNER_TEMP/bad.out"

      - name: Set up tested Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0

      - name: Prove TypeSpec and authored JSON Schema are independent first-class peers
        uses: ORESoftware/typespec-json-schema-validator@07688e1eea92a666f7e8647038c9f2c1544440ed
        with:
          typespec: contracts/platform/typespec/main.tsp
          schema: contracts/platform/json-schema/contract.schema.json
          report: .typespec-json-schema-validator/ores283/report.json
          sarif: .typespec-json-schema-validator/ores283/report.sarif
          contract_ir: .typespec-json-schema-validator/ores283/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores283/generated
          max_probes: '64'

      - name: Require current-input TJSV admission
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@07688e1eea92a666f7e8647038c9f2c1544440ed
        with:
          contract_ir: .typespec-json-schema-validator/ores283/contract-ir.json
          report: .typespec-json-schema-validator/ores283/report.json
          typespec: contracts/platform/typespec/main.tsp
          schema: contracts/platform/json-schema/contract.schema.json
          generated_schema: .typespec-json-schema-validator/ores283/generated/typespec.generated.schema.json
          expected_declarations: '["HackerHouseMedellin.Platform.ReservationContract"]'

      - name: TypeSpec-only drift must fail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .typespec-json-schema-validator/ores283-typespec-drift/source
          sed 's/enabled: boolean;/enabled: string;/' contracts/platform/typespec/main.tsp > .typespec-json-schema-validator/ores283-typespec-drift/source/main.tsp

      - name: Check TypeSpec-only drift
        id: typespec_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@07688e1eea92a666f7e8647038c9f2c1544440ed
        with:
          typespec: .typespec-json-schema-validator/ores283-typespec-drift/source/main.tsp
          schema: contracts/platform/json-schema/contract.schema.json
          report: .typespec-json-schema-validator/ores283-typespec-drift/report.json
          contract_ir: .typespec-json-schema-validator/ores283-typespec-drift/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores283-typespec-drift/generated
          max_probes: '64'

      - name: Assert TypeSpec-only drift rejection
        env:
          OUTCOME: ${{ steps.typespec_drift.outcome }}
        run: test "$OUTCOME" = failure

      - name: Prepare JSON-Schema-only drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .typespec-json-schema-validator/ores283-json-drift/source
          cp contracts/platform/json-schema/contract.schema.json .typespec-json-schema-validator/ores283-json-drift/source/contract.schema.json
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = '.typespec-json-schema-validator/ores283-json-drift/source/contract.schema.json';
          const schema = JSON.parse(await readFile(path, 'utf8'));
          schema.$defs.ReservationContract.properties.enabled.type = 'string';
          await writeFile(path, `${JSON.stringify(schema, null, 2)}\n`);
          NODE

      - name: Check JSON-Schema-only drift
        id: schema_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@07688e1eea92a666f7e8647038c9f2c1544440ed
        with:
          typespec: contracts/platform/typespec/main.tsp
          schema: .typespec-json-schema-validator/ores283-json-drift/source/contract.schema.json
          report: .typespec-json-schema-validator/ores283-json-drift/report.json
          contract_ir: .typespec-json-schema-validator/ores283-json-drift/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores283-json-drift/generated
          max_probes: '64'

      - name: Assert JSON-Schema-only drift rejection and source immutability
        env:
          OUTCOME: ${{ steps.schema_drift.outcome }}
        run: |
          test "$OUTCOME" = failure
          git diff --exit-code -- contracts/platform
